{% extends "base.html" %}

    {% block title %}Login | MavLost{% endblock %}

    {% block content %}
    <div class="container login-page">
    <h1>Login to MavLost</h1>

    <!-- display form and submit login credentials -->
    <form method="post" class="login-form">
            {% csrf_token %}    
            {{ form.as_p }}
            <!-- redirect to next page after login -->
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Login</button>
    </form>

    <!-- return to homepage -->
    <a href="{% url 'home' %}" class="back-link">Back to homepage</a>
    </div>  
    {% endblock %}
