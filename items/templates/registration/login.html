<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MavLost</title>
</head>
<body>
   <h1>Login to MavLost</h1>

   <!-- display form and submit login credentials -->
   <form method="post">
        {% csrf_token %}    
        {{ form.as_p }}
        <!-- redirect to next page after login -->
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Login</button>
   </form>

   <!-- return to homepage -->
   <a href="{% url 'home' %}">Back to homepage</a>

</body>
</html>
