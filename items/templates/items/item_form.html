{% extends "base.html" %}

    <!-- set title -->
    {% block title %}
    <title>{% if form.instance.pk %}Edit Item{% else %}Report an Item{% endif %}</title>
    {% endblock %}

    {% block content %}
    <div class="container item-form-page">
    <h1>
            {% if form.instance.pk %}
                Edit Item
            {% else %}
                Report an Item
            {% endif %}
    </h1>

    <!-- submit form for reporting lost/found item -->
    <form method="post" enctype="multipart/form-data" class="item-form">
            {% csrf_token %}    
            {{ form.as_p }}
            <button type="submit">
                {% if form.instance.pk %}
                    Save Changes
                {% else %}
                    Submit Report
                {% endif %}</button>
    </form>

    <!-- link to return to homepage -->
    <a href="{% url 'home' %}" class="back-link">Back to homepage</a>
    </div>
    {% endblock %}
