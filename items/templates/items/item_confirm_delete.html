<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Item | MavLost</title>
</head>
<body>
   <h1>Delete Item</h1>

   <p>Are you sure you want to delete "{{ item.name }}"?</p>

   <!-- delete item only if confirmed -->
   <form method="post">
        {% csrf_token %}    
        <button type="submit">Delete</button>
   </form>

   <!-- return to item list w/o deleting item -->
   <a href="{% url 'item_list' %}">Cancel</a>

</body>
</html>
