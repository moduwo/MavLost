{% extends "base.html" %}

    {% block title %}Login | MavLost{% endblock %}

    {% block content %}
    <div class="container delete-page">
    <h1>Delete Item</h1>

    <p>Are you sure you want to delete "{{ item.name }}"?</p>

    <!-- delete item only if confirmed -->
    <form method="post" class="delete-form">
        {% csrf_token %}    
        <button type="submit">Delete</button>
    </form>

    <!-- return to item list w/o deleting item -->
    <a href="{% url 'item_list' %}" class="cancel-link">Cancel</a>
    </div>
    {% endblock %}
